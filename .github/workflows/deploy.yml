name: Publish Voxel City Driver
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify game logic
        run: npm run check
      - name: Build for GitHub Pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Browser smoke test (real WebAssembly and WebGL)
        run: |
          ln -s dist "${{ github.event.repository.name }}"
          python3 -m http.server 4173 --bind 127.0.0.1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for n in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:4173/${{ github.event.repository.name }}/" > /dev/null && break
            sleep 1
          done
          npm run smoke
      - name: Upload game playtest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gogogo-browser-playtest
          path: |
            game-title-smoke.png
            game-driving-smoke.png
            game-mountain-smoke.png
            game-mobile-passenger-smoke.png
            browser-smoke-failure.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
